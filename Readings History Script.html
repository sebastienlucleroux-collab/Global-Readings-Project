<script>
  // ---------------------------
  // GLOBAL VARIABLES
  // ---------------------------
  let alertInfo = [];
  let allData = null;
  let table; // ✅ Accessible globally

  // ---------------------------
  // INITIAL SETUP
  // ---------------------------
  document.addEventListener("DOMContentLoaded", function () {
    console.log("DOM ready — initializing Tabulator...");

    // Wait for #example-table to exist before building Tabulator
    const tableElement = document.getElementById("example-table");
    if (!tableElement) {
      console.error("❌ Table element not found!");
      return;
    }

    // Initialize Tabulator
    table = new Tabulator("#example-table", {
      data: [],
      layout: "fitColumns",
      responsiveLayout: "hide",
      addRowPos: "top",
      history: true,
      pagination: "local",
      paginationSize: 15,
      paginationCounter: "rows",
      movableColumns: true,
      initialSort: [{ column: "date", dir: "asc" }],
      columnDefaults: { tooltip: true },
      columns: [
        { title: "Date", field: "date", sorter: "date", sorterParams: { format: "yyyy/MM/dd" } },
        { title: "Time", field: "time" },
        { title: "Temperature", field: "temperature" },
        { title: "Humidity", field: "humidity" },
        { title: "Pressure", field: "pressure" },
      ],
    });

    // ✅ Wait until Tabulator finishes rendering
    table.on("tableBuilt", function () {
      console.log("✅ Tabulator ready — loading sensor data...");
      changeTableData();
    });

    // Refresh Button
    const refreshBtn = document.getElementById("refreshDataBtn");
    if (refreshBtn) {
      refreshBtn.addEventListener("click", function () {
        console.log("Manual refresh triggered (History)...");
        refreshBtn.textContent = "Refreshing...";
        refreshBtn.disabled = true;

        google.script.run
          .withSuccessHandler(function (result) {
            allData = result;
            sessionStorage.setItem("allSensorData", JSON.stringify(result));
            console.log("History data refreshed!");
            changeTableData();
            refreshBtn.textContent = "🔄 Refresh Data";
            refreshBtn.disabled = false;
          })
          .withFailureHandler(function (error) {
            console.error("Refresh failed:", error);
            refreshBtn.textContent = "🔄 Refresh Data";
            refreshBtn.disabled = false;
          })
          .getAllSensorData();
      });
    }

    // Restore previous sensor
    const savedSensor = sessionStorage.getItem("selectedSensor");
    const selector = document.getElementById("locationSelector");
    if (selector && savedSensor !== null) selector.value = savedSensor;

    // React to location change
    selector.addEventListener("change", () => {
      sessionStorage.setItem("selectedSensor", selector.value);
      changeTableData();
    });
  });

  // ---------------------------
  // UPDATE TABLE DATA
  // ---------------------------
  function changeTableData() {
    if (!table) {
      console.warn("⚠️ Table not ready yet — skipping update.");
      return;
    }

    let index = document.getElementById("locationSelector")?.value;
    const qrSensor = new URLSearchParams(window.location.search).get("sensor");
    if (!index && qrSensor !== null) index = qrSensor;

    if (index !== null && index !== undefined) {
      sessionStorage.setItem("selectedSensor", index);
    }

    const cached = sessionStorage.getItem("allSensorData");

    if (cached) {
      console.log("Loaded history from cache!");
      const allData = JSON.parse(cached);
      if (allData[index]) {
        const sensorData = allData[index].map(row => ({
          date: row[0],
          time: row[1],
          temperature: row[2],
          humidity: row[3],
          pressure: row[4],
        }));
        table.replaceData(sensorData);
        return;
      } else {
        console.warn("Cache found, but no data for this sensor — fetching fresh...");
      }
    }

    document.querySelector("#example-table").innerHTML = "<p>Loading data...</p>";

    google.script.run
      .withSuccessHandler(function (result) {
        sessionStorage.setItem("allSensorData", JSON.stringify(result));
        if (result[index]) {
          const sensorData = result[index].map(row => ({
            date: row[0],
            time: row[1],
            temperature: row[2],
            humidity: row[3],
            pressure: row[4],
          }));
          table.replaceData(sensorData);
        } else {
          document.querySelector("#example-table").innerHTML = "<p>No data available for this sensor.</p>";
        }
      })
      .withFailureHandler(function (error) {
        console.error("Error fetching all data:", error);
        document.querySelector("#example-table").innerHTML = "<p>Error loading data.</p>";
      })
      .getAllSensorData();
  }

  // ---------------------------
  // FILTERING
  // ---------------------------
  function filterData() {
    if (!table) {
      console.warn("⚠️ Table not ready yet — cannot apply filter.");
      return;
    }

    google.script.run
      .withSuccessHandler(function (result) {
        alertInfo = result;
        setCustomFilter();
      })
      .withFailureHandler(function (error) {
        console.error("Error fetching alert info:", error);
      })
      .getAlertInfo();
  }

  function setCustomFilter() {
    if (!table) return;

    table.clearFilter();
    const filterType = document.getElementById("readingFilter").value;
    const locationIndex = Number(document.getElementById("locationSelector").value);
    if (filterType === "none") return;

    let customRangeFilter = null;

    if (filterType === "temperature") {
      customRangeFilter = (data) => {
        const value = parseFloat(data.temperature);
        const lower = alertInfo[locationIndex][2];
        const upper = alertInfo[locationIndex][1];
        return value < lower || value > upper;
      };
    } else if (filterType === "humidity") {
      customRangeFilter = (data) => {
        const value = parseFloat(data.humidity);
        const lower = alertInfo[locationIndex][4];
        const upper = alertInfo[locationIndex][3];
        return value / 100 < lower || value / 100 > upper;
      };
    } else if (filterType === "pressure") {
      customRangeFilter = (data) => {
        const value = parseFloat(data.pressure);
        const lower = alertInfo[locationIndex][6];
        const upper = alertInfo[locationIndex][5];
        return value < lower || value > upper;
      };
    }

    if (customRangeFilter) {
      table.setFilter(customRangeFilter);
    }
  }
</script>
