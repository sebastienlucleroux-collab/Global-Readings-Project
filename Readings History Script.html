<script>
  let alertInfo = [];
  let tableData = [];
  let table;

  // ✅ Wait until DOM + container is actually ready
  document.addEventListener("DOMContentLoaded", () => {
    console.log("DOM loaded — waiting for #example-table to exist...");
    waitForElement("#example-table", initializeTabulator);
  });

  function waitForElement(selector, callback) {
    const el = document.querySelector(selector);
    if (el) {
      callback(el);
      return;
    }
    const observer = new MutationObserver((mutations, obs) => {
      const element = document.querySelector(selector);
      if (element) {
        obs.disconnect();
        callback(element);
      }
    });
    observer.observe(document, { childList: true, subtree: true });
  }

  // ✅ Initialize Tabulator safely
  function initializeTabulator(el) {
    console.log("Initializing Tabulator...");
    table = new Tabulator(el, {
      data: [],
      layout: "fitColumns",
      responsiveLayout: "hide",
      addRowPos: "top",
      history: true,
      pagination: "local",
      paginationSize: 15,
      paginationCounter: "rows",
      movableColumns: true,
      initialSort: [{ column: "date", dir: "asc" }],
      columnDefaults: { tooltip: true },
      columns: [
        { title: "Date", field: "date", sorter: "date", sorterParams: { format: "yyyy/MM/dd", alignEmptyValues: "top" } },
        { title: "Time", field: "time" },
        { title: "Temperature", field: "temperature" },
        { title: "Humidity", field: "humidity" },
        { title: "Pressure", field: "pressure" },
      ],
    });

    setupEventListeners();
    restoreSensorSelection();
    changeTableData();
  }

  function setupEventListeners() {
    console.log("Setting up event listeners...");
    const refreshBtn = document.getElementById("refreshDataBtn");
    if (refreshBtn) {
      refreshBtn.addEventListener("click", handleRefresh);
    }

    const selector = document.getElementById("locationSelector");
    if (selector) {
      selector.addEventListener("change", () => {
        console.log("Sensor changed — updating table...");
        sessionStorage.setItem("selectedSensor", selector.value);
        changeTableData();
      });
    }
  }

  function handleRefresh() {
    const refreshBtn = document.getElementById("refreshDataBtn");
    refreshBtn.textContent = "Refreshing...";
    refreshBtn.disabled = true;

    google.script.run
      .withSuccessHandler((result) => {
        sessionStorage.setItem("allSensorData", JSON.stringify(result));
        console.log("Data refreshed.");
        changeTableData();
        refreshBtn.textContent = "🔄 Refresh Data";
        refreshBtn.disabled = false;
      })
      .withFailureHandler((err) => {
        console.error("Refresh failed:", err);
        refreshBtn.textContent = "🔄 Refresh Data";
        refreshBtn.disabled = false;
      })
      .getAllSensorData();
  }

  function restoreSensorSelection() {
    const savedSensor = sessionStorage.getItem("selectedSensor");
    if (savedSensor !== null) {
      const selector = document.getElementById("locationSelector");
      if (selector) selector.value = savedSensor;
    }
  }

  // ---------------------------
  // UPDATE TABLE DATA
  // ---------------------------
  function changeTableData() {
    // Get currently selected sensor (or from session/QR if missing)
    let index = document.getElementById("locationSelector")?.value;
    const qrSensor = new URLSearchParams(window.location.search).get("sensor");
    if (!index && qrSensor !== null) index = qrSensor;

    // Persist selection to sessionStorage
    if (index !== null && index !== undefined) {
      sessionStorage.setItem("selectedSensor", index);
    }

    // Try to load cached history
    const cached = sessionStorage.getItem("allSensorData");

    if (cached) {
      console.log("Loaded history from cache!");
      const allData = JSON.parse(cached);

      if (allData[index]) {
        const sensorData = allData[index];
        const tableData = sensorData.map(row => ({
          date: row[0],
          time: row[1],
          temperature: row[2],
          humidity: row[3],
          pressure: row[4]
        }));
        table.replaceData(tableData);
        return;
      } else {
        console.warn("Cache found, but no data for this sensor — fetching fresh...");
      }
    } else {
      console.log("No cache found — fetching all data from server...");
    }

    // Fallback: fetch full dataset (and cache it for later)

    google.script.run
      .withSuccessHandler(function (allData) {
        // Cache entire dataset
        sessionStorage.setItem("allSensorData", JSON.stringify(allData));

        if (allData[index]) {
          const sensorData = allData[index];
          const tableData = sensorData.map(row => ({
            date: row[0],
            time: row[1],
            temperature: row[2],
            humidity: row[3],
            pressure: row[4]
          }));
          table.replaceData(tableData);
        } else {
          document.querySelector("#example-table").innerHTML = "<p>No data available for this sensor.</p>";
        }
      })
      .withFailureHandler(function (error) {
        console.error("Error fetching all data:", error);
        document.querySelector("#example-table").innerHTML = "<p>Error loading data.</p>";
      })
      .getAllSensorData();
  }


  // ---------------------------
  // FETCH ALERT INFO & FILTER
  // ---------------------------
  function filterData() {
    if (!table) {
      console.warn("Table not ready yet — cannot apply filter.");
      return;
    }

    google.script.run
      .withSuccessHandler(function (result) {
        alertInfo = result;
        setCustomFilter();
      })
      .withFailureHandler(function (error) {
        console.error("Error fetching alert info:", error);
      })
      .getAlertInfo();
  }

  function setCustomFilter() {
    if (!table) {
      console.warn("Table not initialized — skipping filter.");
      return;
    }

    table.clearFilter();

    const filterType = document.getElementById("readingFilter").value;
    const locationIndex = Number(document.getElementById("locationSelector").value);

    if (filterType === "none") return;

    let customRangeFilter = null;

    if (filterType === "temperature") {
      customRangeFilter = function (data) {
        const value = parseFloat(data.temperature);
        const lowerBound = alertInfo[locationIndex][2];
        const upperBound = alertInfo[locationIndex][1];
        return value < lowerBound || value > upperBound;
      };
    } else if (filterType === "humidity") {
      customRangeFilter = function (data) {
        const value = parseFloat(data.humidity);
        const lowerBound = alertInfo[locationIndex][4];
        const upperBound = alertInfo[locationIndex][3];
        return (value / 100) < lowerBound || (value / 100) > upperBound;
      };
    } else if (filterType === "pressure") {
      customRangeFilter = function (data) {
        const value = parseFloat(data.pressure);
        const lowerBound = alertInfo[locationIndex][6];
        const upperBound = alertInfo[locationIndex][5];
        return value < lowerBound || value > upperBound;
      };
    }

    if (customRangeFilter) {
      table.setFilter(customRangeFilter);
    }
  }
</script>
