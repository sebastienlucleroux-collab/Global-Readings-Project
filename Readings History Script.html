<script>
  let alertInfo = [];
  let table;
  let tableInitialized = false;

  // ✅ Wait for DOM and for #example-table to be available
  document.addEventListener("DOMContentLoaded", () => {
    console.log("Waiting for #example-table...");
    waitForElement("#example-table", initializeTabulator);
  });

  // ---------------------------
  // HELPER — wait until element truly exists
  // ---------------------------
  function waitForElement(selector, callback) {
    const el = document.querySelector(selector);
    if (el) return callback(el);

    const observer = new MutationObserver((mutations, obs) => {
      const el = document.querySelector(selector);
      if (el) {
        obs.disconnect();
        callback(el);
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  // ---------------------------
  // TABULATOR INITIALIZATION
  // ---------------------------
  function initializeTabulator(el) {
    if (tableInitialized) return; // prevent duplicate init
    tableInitialized = true;
    console.log("Initializing Tabulator...");

    table = new Tabulator(el, {
      data: [],
      layout: "fitColumns",
      responsiveLayout: "hide",
      addRowPos: "top",
      history: true,
      pagination: "local",
      paginationSize: 15,
      paginationCounter: "rows",
      movableColumns: true,
      initialSort: [{ column: "date", dir: "asc" }],
      columnDefaults: { tooltip: true },
      columns: [
        { title: "Date", field: "date", sorter: "date", sorterParams: { format: "yyyy/MM/dd", alignEmptyValues: "top" } },
        { title: "Time", field: "time" },
        { title: "Temperature", field: "temperature" },
        { title: "Humidity", field: "humidity" },
        { title: "Pressure", field: "pressure" },
      ],
    });

    setupListeners();
    restoreSensorSelection();
    changeTableData();
  }

  // ---------------------------
  // EVENT LISTENERS
  // ---------------------------
  function setupListeners() {
    const refreshBtn = document.getElementById("refreshDataBtn");
    if (refreshBtn) {
      refreshBtn.addEventListener("click", handleRefresh);
    }

    const selector = document.getElementById("locationSelector");
    if (selector) {
      selector.addEventListener("change", () => {
        sessionStorage.setItem("selectedSensor", selector.value);
        changeTableData();
      });
    }

    const filterSelect = document.getElementById("readingFilter");
    if (filterSelect) {
      filterSelect.addEventListener("change", filterData);
    }
  }

  // ---------------------------
  // REFRESH HANDLER
  // ---------------------------
  function handleRefresh() {
    const refreshBtn = document.getElementById("refreshDataBtn");
    if (!refreshBtn) return;

    refreshBtn.textContent = "Refreshing...";
    refreshBtn.disabled = true;

    google.script.run
      .withSuccessHandler((result) => {
        sessionStorage.setItem("allSensorData", JSON.stringify(result));
        console.log("History data refreshed");
        changeTableData();
        refreshBtn.textContent = "🔄 Refresh Data";
        refreshBtn.disabled = false;
      })
      .withFailureHandler((err) => {
        console.error("Refresh failed:", err);
        refreshBtn.textContent = "🔄 Refresh Data";
        refreshBtn.disabled = false;
      })
      .getAllSensorData();
  }

  // ---------------------------
  // RESTORE SENSOR SELECTION
  // ---------------------------
  function restoreSensorSelection() {
    const saved = sessionStorage.getItem("selectedSensor");
    if (saved !== null) {
      const selector = document.getElementById("locationSelector");
      if (selector) selector.value = saved;
    }
  }

  // ---------------------------
  // CHANGE TABLE DATA
  // ---------------------------
  function changeTableData() {
    if (!table) {
      console.warn("Table not initialized yet — skipping data change.");
      return;
    }

    let index = document.getElementById("locationSelector")?.value;
    const qrSensor = new URLSearchParams(window.location.search).get("sensor");
    if (!index && qrSensor !== null) index = qrSensor;

    if (index !== null && index !== undefined)
      sessionStorage.setItem("selectedSensor", index);

    const cached = sessionStorage.getItem("allSensorData");
    if (cached) {
      console.log("Loaded history from cache!");
      const allData = JSON.parse(cached);
      if (allData[index]) {
        const sensorData = allData[index];
        const formatted = sensorData.map(r => ({
          date: r[0], time: r[1],
          temperature: r[2], humidity: r[3], pressure: r[4]
        }));
        table.replaceData(formatted);
        return;
      }
    }

    console.log("Fetching full dataset...");
    google.script.run
      .withSuccessHandler((allData) => {
        sessionStorage.setItem("allSensorData", JSON.stringify(allData));
        if (allData[index]) {
          const sensorData = allData[index];
          const formatted = sensorData.map(r => ({
            date: r[0], time: r[1],
            temperature: r[2], humidity: r[3], pressure: r[4]
          }));
          table.replaceData(formatted);
        }
      })
      .withFailureHandler((err) => console.error("Error fetching data:", err))
      .getAllSensorData();
  }

  // ---------------------------
  // FILTER HANDLING
  // ---------------------------
  function filterData() {
    if (!table) return;
    google.script.run
      .withSuccessHandler((result) => {
        alertInfo = result;
        applyFilter();
      })
      .withFailureHandler((err) => console.error("Error fetching alert info:", err))
      .getAlertInfo();
  }

  function applyFilter() {
    if (!table) return;
    table.clearFilter();

    const filterType = document.getElementById("readingFilter").value;
    const idx = Number(document.getElementById("locationSelector").value);
    if (filterType === "none") return;

    const info = alertInfo[idx];
    if (!info) return;

    let customFilter;
    if (filterType === "temperature") {
      customFilter = (d) =>
        parseFloat(d.temperature) < info[2] || parseFloat(d.temperature) > info[1];
    } else if (filterType === "humidity") {
      customFilter = (d) =>
        d.humidity / 100 < info[4] || d.humidity / 100 > info[3];
    } else if (filterType === "pressure") {
      customFilter = (d) =>
        parseFloat(d.pressure) < info[6] || parseFloat(d.pressure) > info[5];
    }

    if (customFilter) table.setFilter(customFilter);
  }
</script>
