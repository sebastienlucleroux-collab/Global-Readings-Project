<script>
  let alertInfo = [];
  let allData = null;
  let table;

  document.addEventListener("DOMContentLoaded", async () => {
    // 1) populate dropdown from server (or cache)
    try {
      await populateLocationDropdown_history();
    } catch (err) {
      console.error("populateLocationDropdown_history failed:", err);
    }

    // 2) initialize Tabulator
    initializeTabulator();

    // 3) restore selection from QR or session
    const params = new URLSearchParams(window.location.search);
    const qrSensor = params.get("sensor");
    if (qrSensor !== null) sessionStorage.setItem("selectedSensor", qrSensor);
    const savedSensor = sessionStorage.getItem("selectedSensor");
    const selector = document.getElementById("locationSelector");
    if (selector && savedSensor !== null) selector.value = savedSensor;

    // 4) link selector change
    if (selector) {
      selector.addEventListener("change", () => {
        sessionStorage.setItem("selectedSensor", selector.value);
        changeTableData();
      });
    }

    // 5) refresh button
    const refreshBtn = document.getElementById("refreshDataBtn");
    if (refreshBtn) {
      refreshBtn.addEventListener("click", () => {
        refreshBtn.textContent = "Refreshing...";
        refreshBtn.disabled = true;
        google.script.run
          .withSuccessHandler(result => {
            allData = result || {};
            sessionStorage.setItem("allSensorData", JSON.stringify(allData));
            changeTableData();
            refreshBtn.textContent = "🔄 Refresh Data";
            refreshBtn.disabled = false;
          })
          .withFailureHandler(err => {
            console.error("Refresh failed:", err);
            refreshBtn.textContent = "🔄 Refresh Data";
            refreshBtn.disabled = false;
          })
          .getAllSensorData();
      });
    }
  });

  document.addEventListener("DOMContentLoaded", () => {
    const selector = document.getElementById("locationSelector");
    if (selector) selector.addEventListener("change", changeTableData);

    const filter = document.getElementById("readingFilter");
    if (filter) filter.addEventListener("change", filterData);
  });


  async function populateLocationDropdown_history() {
    const selector = document.getElementById("locationSelector");
    if (!selector) return;

    selector.querySelectorAll("option:not([value=''])").forEach(o => o.remove());

    const cached = sessionStorage.getItem("locationList");
    if (cached) {
      fillSelectWithLocations(selector, JSON.parse(cached));
      return;
    }

    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(locations => {
          if (!Array.isArray(locations)) locations = [];
          sessionStorage.setItem("locationList", JSON.stringify(locations));
          fillSelectWithLocations(selector, locations);
          resolve();
        })
        .withFailureHandler(err => {
          console.error("getLocations failed:", err);
          reject(err);
        })
        .getLocations();
    });
  }

  function fillSelectWithLocations(selectElement, locations) {
    selectElement.querySelectorAll("option:not([value=''])").forEach(o => o.remove());
    locations.forEach((loc, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = loc;
      selectElement.appendChild(opt);
    });
  }

  function initializeTabulator() {
    const el = document.getElementById("example-table");
    if (!el) {
      console.error("No #example-table found");
      return;
    }

    function getDynamicPageSize() {
      const screenHeight = window.innerHeight;

      if (screenHeight > 1000) return 20; // large desktop
      if (screenHeight > 800) return 15;  // small desktop / landscape tablet
      if (screenHeight > 650) return 10;  // portrait tablet
      if (screenHeight > 500) return 7;   // large phone
      return 5;                           // small phone
    }

    table = new Tabulator("#example-table", {
      data: [],
      layout: "fitColumns",
      responsiveLayout: "hide",
      addRowPos: "top",
      history: true,
      pagination: "local",
      paginationSize: getDynamicPageSize(),
      paginationCounter: "rows",
      movableColumns: true,
      initialSort: [{ column: "date", dir: "desc" }],
      columnDefaults: { tooltip: true },
      columns: [
        { title: "Date", field: "date", sorter: "date", sorterParams: { format: "yyyy/MM/dd" } },
        { title: "Time", field: "time" },
        { title: "Temperature", field: "temperature" },
        { title: "Humidity", field: "humidity" },
        { title: "Pressure", field: "pressure" },
      ]
    });

    table.on("tableBuilt", () => {
      changeTableData();
    });
    table.on("dataLoaded", () => {
      const newHeight = Math.max(300, window.innerHeight * 0.45);
      table.setHeight(newHeight);
    });

    window.addEventListener("resize", () => {
      if (table) {
        table.setHeight(Math.max(300, window.innerHeight * 0.45));
      }
    });

  }

  function changeTableData() {
    if (!table) {
      console.warn("Table not initialized yet");
      return;
    }

    let index = document.getElementById("locationSelector")?.value;
    const qrSensor = new URLSearchParams(window.location.search).get("sensor");
    // treat index as missing only if it's null/undefined/empty string
    if ((index === null || index === undefined || index === "") && qrSensor !== null) {
      index = qrSensor;
    }

    if (index !== null && index !== undefined) sessionStorage.setItem("selectedSensor", index);

    const cached = sessionStorage.getItem("allSensorData");
    if (cached) {
      const all = JSON.parse(cached);
      if (all[index]) {
        const sensorData = all[index].map(r => ({ date: r[0], time: r[1], temperature: r[2], humidity: r[3], pressure: r[4] }));
        table.replaceData(sensorData);
        filterData();
        return;
      }
    }

    // fallback: fetch all data then populate and cache
    google.script.run
      .withSuccessHandler(result => {
        const validData = result && typeof result === "object" ? result : {};
        sessionStorage.setItem("allSensorData", JSON.stringify(validData));
        const sensorRows = validData[index]?.map(([date, time, temp, hum, pres]) => ({
          date, time, temperature: temp, humidity: hum, pressure: pres
        })) || [];
        safeReplaceTableData(sensorRows);
        filterData();
      })
      .withFailureHandler(err => {
        console.error("Error fetching all data:", err);
        safeReplaceTableData([]);
      })
      .getAllSensorData();
  }

  function safeReplaceTableData(rows) {
    if (!table) return;
    try {
      table.replaceData(rows);
    } catch (err) {
      // If replaceData failed because table not ready, wait for build then try once
      const handler = () => {
        try { table.replaceData(rows); } catch (e) { console.error("replaceData after build failed:", e); }
        // remove handler if possible — Tabulator `off` API exists in v6
        try { table.off && table.off("tableBuilt", handler); } catch (e) { }
      };
      if (table.on) table.on("tableBuilt", handler);
    }
  }

  function filterData() {
    google.script.run
      .withSuccessHandler(function (result) {
        alertInfo = result;
        console.log("alert info:", alertInfo);
        setCustomFilter();
      })
      .withFailureHandler(function (error) {
        console.error("Error fetching alert info:", error);
      })
      .getAlertInfo();
  }

  function setCustomFilter() {
    table.clearFilter();

    const filterType = document.getElementById("readingFilter").value;
    const locationIndex = Number(document.getElementById("locationSelector").value);

    if (filterType === "none" || isNaN(locationIndex)) {
      console.log("No filter applied.");
      return;
    }

    let customRangeFilter = null;

    if (filterType === "temperature") {
      customRangeFilter = function (data) {
        const raw = data.temperature;
        if (raw === "N/A" || raw === "" || raw == null) return false;
        const value = parseFloat(raw);
        if (isNaN(value)) return false;
        const lowerBound = alertInfo[locationIndex][2];
        const upperBound = alertInfo[locationIndex][1];
        return value < lowerBound || value > upperBound;
      };
    } else if (filterType === "humidity") {
      customRangeFilter = function (data) {
        const raw = data.humidity;
        if (raw === "N/A" || raw === "" || raw == null) return false;
        const value = parseFloat(raw);
        if (isNaN(value)) return false;
        const lowerBound = alertInfo[locationIndex][4];
        const upperBound = alertInfo[locationIndex][3];
        return (value / 100) < lowerBound || (value / 100) > upperBound;
      };
    } else if (filterType === "pressure") {
      customRangeFilter = function (data) {
        const raw = data.pressure;
        if (raw === "N/A" || raw === "" || raw == null) return false;
        const value = parseFloat(raw);
        if (isNaN(value)) return false;
        const lowerBound = alertInfo[locationIndex][6];
        const upperBound = alertInfo[locationIndex][5];
        return value < lowerBound || value > upperBound;
      };
    }

    if (customRangeFilter) {
      table.setFilter(customRangeFilter);
      console.log(`Filter applied for: ${filterType}`);
    }
  }
</script>
