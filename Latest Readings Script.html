<script>

  let latestData = {};
  let allData = null;

  // will be set after DOM loads
  let cells = {};

  document.addEventListener("DOMContentLoaded", async () => {

    /* ============================================================
       DOM ELEMENTS — NOW SAFE
       ============================================================ */
    cells = {
      date: document.getElementById("dateCell"),
      time: document.getElementById("timeCell"),
      temperature: document.getElementById("temperatureCell"),
      humidity: document.getElementById("humidityCell"),
      pressure: document.getElementById("pressureCell"),
    };

    console.log("✔ Cells initialized");

    /* ============================================================
       Load locations first
       ============================================================ */
    console.log("⏳ Populating locations...");
    await populateLocationDropdown();
    console.log("✅ Locations loaded");

    /* ============================================================
       Load latest data
       ============================================================ */
    console.log("⏳ Fetching latest readings...");
    await loadLatestThenAllData();
    console.log("✅ Latest readings loaded");

    /* ============================================================
       Preselect SENSOR from URL
       ============================================================ */
    applyURLSensorSelection();

    /* ============================================================
       Refresh button
       ============================================================ */
    const refreshBtn = document.getElementById("refreshDataBtn");
    if (refreshBtn) {
      refreshBtn.addEventListener("click", async () => {
        if (refreshBtn.disabled) return;
        setRefreshButtonState(true);

        try {
          const result = await fetchLatestSensorData();
          latestData = result || {};
          cacheLatestData(result);
          updateTable();
        } catch (error) {
          console.error("Refresh failed:", error);
          alert("Failed to refresh data. Please try again later.");
        } finally {
          setRefreshButtonState(false);
        }
      });
    }
  });


  /* ============================================================
     URL SENSOR PRE-SELECTION — 100% RELIABLE NOW
     ============================================================ */
  function applyURLSensorSelection() {
    const sensorFromURL = window.SENSOR_FROM_SERVER;

    if (sensorFromURL === null || sensorFromURL === "") return;

    console.log("🎯 Attempting URL preselect:", sensorFromURL);

    const selector = document.getElementById("locationSelector");
    if (!selector) {
      console.error("❌ Selector missing");
      return;
    }

    const wait = setInterval(() => {
      if (selector.options.length > 1) {
        clearInterval(wait);
        selector.value = String(sensorFromURL);
        console.log("🎯 PRESELECTED:", sensorFromURL);
        updateTable();
      }
    }, 80);
  }


  /* ============================================================
     Refresh button helper
     ============================================================ */
  function setRefreshButtonState(isLoading) {
    const btn = document.getElementById("refreshDataBtn");
    if (!btn) return;
    btn.textContent = isLoading ? "Refreshing..." : "Refresh Data";
    btn.disabled = isLoading;
  }


  /* ============================================================
     Fetch Latest Sensor Data
     ============================================================ */
  function fetchLatestSensorData() {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)   // <- actually resolve the data
        .withFailureHandler(reject)
        .getLatestSensorData();
    });
  }

  function cacheLatestData(data) {
    sessionStorage.setItem("latestSensorData", JSON.stringify(data || {}));
  }


  /* ============================================================
     Populate dropdown from server
     ============================================================ */
  async function populateLocationDropdown() {
    const selector = document.getElementById("locationSelector");
    if (!selector) return;

    // check session cache
    const cached = sessionStorage.getItem("locationList");
    if (cached) {
      try {
        const parsed = JSON.parse(cached);
        if (Array.isArray(parsed) && parsed.length > 0) {
          fillSelectWithLocations(selector, parsed);
          return;
        }
      } catch {
        sessionStorage.removeItem("locationList");
      }
    }

    // no cache → fetch
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(locations => {
          if (!Array.isArray(locations)) locations = [];
          sessionStorage.setItem("locationList", JSON.stringify(locations));
          fillSelectWithLocations(selector, locations);
          resolve();
        })
        .withFailureHandler(reject)
        .getLocations();
    });
  }

  function fillSelectWithLocations(selectElement, locations) {
    selectElement.querySelectorAll("option:not([value=''])").forEach(o => o.remove());

    if (!locations.length) {
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "No locations available";
      selectElement.appendChild(opt);
      return;
    }

    locations.forEach((location, index) => {
      const opt = document.createElement("option");
      opt.value = String(index);
      opt.textContent = location;
      selectElement.appendChild(opt);
    });
  }


  /* ============================================================
     Load latest + full database
     ============================================================ */
  async function loadLatestThenAllData() {
    try {
      const cached = sessionStorage.getItem("latestSensorData");
      if (cached) latestData = JSON.parse(cached);

      const fresh = await fetchLatestSensorData();
      if (fresh) {
        latestData = fresh;
        cacheLatestData(fresh);
      }

      updateTable();

      requestIdleCallback(() => {
        google.script.run
          .withSuccessHandler(result => {
            allData = result || {};
            sessionStorage.setItem("allSensorData", JSON.stringify(allData));
            console.log(allData);
          })
          .withFailureHandler(err => console.warn("getAllSensorData failed:", err))
          .getAllSensorData();
      });
    } catch (err) {
      console.error("❌ Failed to load latest readings:", err);
      alert("Could not load latest readings. Please refresh.");
    }
  }


  /* ============================================================
     Update Table
     ============================================================ */
  function updateTable() {
    const selector = document.getElementById("locationSelector");
    if (!selector) return;

    const index = selector.value;
    const reading = latestData[index];

    function setCells([date, time, temp, hum, pressure]) {
      cells.date.textContent = date || "N/A";
      cells.time.textContent = time || "N/A";
      cells.temperature.textContent = temp || "N/A";
      cells.humidity.textContent = hum || "N/A";

      const header = document.getElementById("pressureHeader");

      if (pressure && pressure !== "N/A") {
        header.classList.remove("hidden");
        cells.pressure.classList.remove("hidden");
        cells.pressure.textContent = pressure;
      } else {
        header.classList.add("hidden");
        cells.pressure.classList.add("hidden");
        cells.pressure.textContent = "";
      }
    }

    if (index === "") return setCells(["", "", "", "", ""]);
    if (!Array.isArray(reading)) return setCells(["N/A", "N/A", "N/A", "N/A", ""]);

    setCells(reading);
  }

</script>
