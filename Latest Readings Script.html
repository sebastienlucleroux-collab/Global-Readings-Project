  let latestData = {};
  let allData = null;

  window.onload = function () {
    // Load latest readings quickly
    google.script.run
      .withSuccessHandler(function (result) {
        latestData = result;
        console.log('Latest readings loaded:', latestData);
        // Start background loading of full history
        preloadAllData();
      })
      .withFailureHandler(console.error)
      .getLatestSensorData();
  };

  function preloadAllData() {
    console.log("Preloading all sensor history...");
    google.script.run
      .withSuccessHandler(function (result) {
        allData = result;
        sessionStorage.setItem("allSensorData", JSON.stringify(result));
        console.log("All history preloaded!");
      })
      .withFailureHandler(function (error) {
        console.error("Background preload failed:", error);
      })
      .getAllSensorData();
  }

  function updateTable() {
    const index = document.getElementById('locationSelector').value;
    const lastReading = latestData[index];
    if (!lastReading) return;
    insertValues(lastReading);
  }

  function insertValues(reading) {
    const [date, time, temp, hum, press] = reading;
    document.getElementById('dateCell').textContent = date;
    document.getElementById('timeCell').textContent = time;
    document.getElementById('temperatureCell').textContent = temp;
    document.getElementById('humidityCell').textContent = hum;

    const pressureHeader = document.getElementById('pressureHeader');
    const pressureCell = document.getElementById('pressureCell');

    if (press !== "N/A") {
      pressureHeader.classList.remove('hidden');
      pressureCell.classList.remove('hidden');
      pressureCell.textContent = press;
    } else {
      pressureHeader.classList.add('hidden');
      pressureCell.classList.add('hidden');
      pressureCell.textContent = '';
    }
  }
</script>

</script>
