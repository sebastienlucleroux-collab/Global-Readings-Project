<script>
  // ---------------------------
  // GLOBAL VARIABLES
  // ---------------------------
  let latestData = {};
  let allData = null;

  // ---------------------------
  // ON DOM READY
  // ---------------------------
  document.addEventListener("DOMContentLoaded", function () {
    console.log("DOM ready — setting up Latest Readings...");

    const params = new URLSearchParams(window.location.search);
    const qrSensor = params.get("sensor");

    // If QR code specifies sensor → store it
    if (qrSensor !== null) {
      sessionStorage.setItem("selectedSensor", qrSensor);
    }

    // Restore saved sensor selection
    const savedSensor = sessionStorage.getItem("selectedSensor");
    const selector = document.getElementById("locationSelector");
    if (selector) {
      if (savedSensor !== null) selector.value = savedSensor;
      selector.addEventListener("change", (e) => {
        sessionStorage.setItem("selectedSensor", e.target.value);
        updateTable();
      });
    }

    // Fetch latest readings once DOM is ready
    loadLatestReadings();
  });

  // ---------------------------
  // LOAD LATEST READINGS
  // ---------------------------
  function loadLatestReadings() {
    console.log("Fetching latest readings...");

    google.script.run
      .withSuccessHandler(function (result) {
        latestData = result;
        console.log("Latest readings loaded:", latestData);

        // Start background loading of full history
        preloadAllData();

        // Display current or QR-selected sensor data
        const selectedSensor = sessionStorage.getItem("selectedSensor");
        if (selectedSensor !== null && latestData[selectedSensor]) {
          updateTable();
        } else {
          console.log("No saved sensor or data yet, waiting for user selection.");
        }
      })
      .withFailureHandler(function (error) {
        console.error("Error loading latest readings:", error);
      })
      .getLatestSensorData();
  }

  // ---------------------------
  // PRELOAD ALL SENSOR HISTORY
  // ---------------------------
  function preloadAllData() {
    console.log("Preloading all sensor history...");
    google.script.run
      .withSuccessHandler(function (result) {
        allData = result;
        sessionStorage.setItem("allSensorData", JSON.stringify(result));
        console.log("All history preloaded!");
      })
      .withFailureHandler(function (error) {
        console.error("Background preload failed:", error);
      })
      .getAllSensorData();
  }

  document.addEventListener("DOMContentLoaded", function () {
    const refreshBtn = document.getElementById("refreshDataBtn");
    if (refreshBtn) {
      refreshBtn.addEventListener("click", function () {
        console.log("Manual refresh triggered (Latest Readings)...");
        refreshBtn.textContent = "Refreshing...";
        refreshBtn.disabled = true;

        google.script.run
          .withSuccessHandler(function (result) {
            latestData = result;
            sessionStorage.setItem("latestSensorData", JSON.stringify(result));
            updateTable();
            refreshBtn.textContent = "🔄 Refresh Data";
            refreshBtn.disabled = false;
            console.log("Latest data refreshed!");
          })
          .withFailureHandler(function (error) {
            console.error("Refresh failed:", error);
            refreshBtn.textContent = "🔄 Refresh Data";
            refreshBtn.disabled = false;
          })
          .getLatestSensorData();
      });
    }
  });

  // ---------------------------
  // UPDATE TABLE DISPLAY
  // ---------------------------
  function updateTable() {
    const selector = document.getElementById("locationSelector");
    if (!selector) {
      console.warn("Location selector not found!");
      return;
    }

    const index = selector.value;
    sessionStorage.setItem("selectedSensor", index);

    const lastReading = latestData[index];
    if (!lastReading) {
      console.warn(`No reading found for sensor index ${index}`);
      return;
    }

    insertValues(lastReading);
  }

  // ---------------------------
  // INSERT VALUES INTO DOM
  // ---------------------------
  function insertValues(reading) {
    const [date, time, temp, hum, press] = reading;

    document.getElementById("dateCell").textContent = date || "N/A";
    document.getElementById("timeCell").textContent = time || "N/A";
    document.getElementById("temperatureCell").textContent = temp || "N/A";
    document.getElementById("humidityCell").textContent = hum || "N/A";

    const pressureHeader = document.getElementById("pressureHeader");
    const pressureCell = document.getElementById("pressureCell");

    if (press && press !== "N/A") {
      pressureHeader.classList.remove("hidden");
      pressureCell.classList.remove("hidden");
      pressureCell.textContent = press;
    } else {
      pressureHeader.classList.add("hidden");
      pressureCell.classList.add("hidden");
      pressureCell.textContent = "";
    }
  }
</script>
