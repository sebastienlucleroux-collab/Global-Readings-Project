<script>
  /* Latest Readings client script
     - populate #locationSelector via server getLocations()
     - caches locationList in sessionStorage
     - supports QR param ?sensor= and session persistence
     - preloads allSensorData in background
  */

  let latestData = {};
  let allData = null;

  document.addEventListener("DOMContentLoaded", async () => {
    // 1) Populate locations (from cache or server)
    try {
      await populateLocationDropdown_latest();
    } catch (err) {
      console.error("populateLocationDropdown_latest failed:", err);
    }

    // 2) Restore selection via QR param or session
    const params = new URLSearchParams(window.location.search);
    const qrSensor = params.get("sensor");
    if (qrSensor !== null) sessionStorage.setItem("selectedSensor", qrSensor);

    const savedSensor = sessionStorage.getItem("selectedSensor");
    const selector = document.getElementById("locationSelector");
    if (selector) {
      if (savedSensor !== null) selector.value = savedSensor;
      selector.addEventListener("change", (e) => {
        sessionStorage.setItem("selectedSensor", e.target.value);
        updateTable();
      });
    }

    // 3) Load latest readings and preload full data
    loadLatestReadings();

    // 4) Hook refresh button
    const refreshBtn = document.getElementById("refreshDataBtn");
    if (refreshBtn) {
      refreshBtn.addEventListener("click", () => {
        refreshBtn.textContent = "Refreshing...";
        refreshBtn.disabled = true;
        google.script.run
          .withSuccessHandler(result => {
            latestData = result || {};
            sessionStorage.setItem("latestSensorData", JSON.stringify(latestData));
            updateTable();
            refreshBtn.textContent = "🔄 Refresh Data";
            refreshBtn.disabled = false;
          })
          .withFailureHandler(err => {
            console.error("Refresh failed:", err);
            refreshBtn.textContent = "🔄 Refresh Data";
            refreshBtn.disabled = false;
          })
          .getLatestSensorData();
      });
    }
  });

  async function populateLocationDropdown_latest() {
    const selector = document.getElementById("locationSelector");
    if (!selector) return;

    // Remove previously added non-placeholder options
    selector.querySelectorAll("option:not([value=''])").forEach(o => o.remove());

    const cached = sessionStorage.getItem("locationList");
    if (cached) {
      fillSelectWithLocations(selector, JSON.parse(cached));
      return;
    }

    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(locations => {
          if (!Array.isArray(locations)) locations = [];
          sessionStorage.setItem("locationList", JSON.stringify(locations));
          fillSelectWithLocations(selector, locations);
          resolve();
        })
        .withFailureHandler(err => {
          console.error("getLocations failed:", err);
          reject(err);
        })
        .getLocations();
    });
  }

  function fillSelectWithLocations(selectElement, locations) {
    // keep placeholder option (empty value)
    selectElement.querySelectorAll("option:not([value=''])").forEach(o => o.remove());
    locations.forEach((loc, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = loc;
      selectElement.appendChild(opt);
    });
  }

  function loadLatestReadings() {
    google.script.run
      .withSuccessHandler(result => {
        latestData = result || {};
        preloadAllData();
        const selectedSensor = sessionStorage.getItem("selectedSensor");
        if (selectedSensor !== null && latestData[selectedSensor]) updateTable();
      })
      .withFailureHandler(err => console.error("Error loading latest readings:", err))
      .getLatestSensorData();
  }

  function preloadAllData() {
    google.script.run
      .withSuccessHandler(result => {
        allData = result || {};
        sessionStorage.setItem("allSensorData", JSON.stringify(allData));
      })
      .withFailureHandler(err => console.error("Preload failed:", err))
      .getAllSensorData();
  }

  function updateTable() {
    const selector = document.getElementById("locationSelector");
    if (!selector) return;
    const index = selector.value;
    sessionStorage.setItem("selectedSensor", index);
    const lastReading = latestData[index];
    if (!lastReading) return;
    insertValues(lastReading);
  }

  function insertValues(reading) {
    const [date, time, temp, hum, press] = reading;
    document.getElementById("dateCell").textContent = date || "N/A";
    document.getElementById("timeCell").textContent = time || "N/A";
    document.getElementById("temperatureCell").textContent = temp || "N/A";
    document.getElementById("humidityCell").textContent = hum || "N/A";

    const pressureHeader = document.getElementById("pressureHeader");
    const pressureCell = document.getElementById("pressureCell");
    if (press && press !== "N/A") {
      pressureHeader.classList.remove("hidden");
      pressureCell.classList.remove("hidden");
      pressureCell.textContent = press;
    } else {
      pressureHeader.classList.add("hidden");
      pressureCell.classList.add("hidden");
      pressureCell.textContent = "";
    }
  }
</script>
