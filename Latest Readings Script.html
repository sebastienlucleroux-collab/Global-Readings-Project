<script>
  let latestData = {};
  let allData = null;

  const cells = {
    date: document.getElementById("dateCell"),
    time: document.getElementById("timeCell"),
    temperature: document.getElementById("temperatureCell"),
    humidity: document.getElementById("humidityCell"),
    pressure: document.getElementById("pressureCell"),
  };

  document.addEventListener("DOMContentLoaded", async () => {
    // 1) Populate locations (from cache or server)
    try {
      await populateLocationDropdown_latest();
    } catch (error) {
      console.error("populateLocationDropdown_latest failed:", error);
    }

    // 2) Restore selection via QR param or session
    const params = new URLSearchParams(window.location.search);
    const qrSensor = params.get("sensor");
    const selector = document.getElementById("locationSelector");
    if (qrSensor !== null) sessionStorage.setItem("selectedSensor", qrSensor);

    const savedSensor = sessionStorage.getItem("selectedSensor");
    if (selector) {
      const validOption = selector.querySelector(`option[value="${savedSensor}"]`);
      if (savedSensor && validOption) {
        selector.value = savedSensor;
      } else {
        selector.selectedIndex = 0; // fallback to placeholder
        sessionStorage.removeItem("selectedSensor");
      }

      selector.addEventListener("change", (e) => {
        sessionStorage.setItem("selectedSensor", e.target.value);
        updateTable();
      });
    }

    // 3) Load latest readings and preload full data
    await loadLatestThenAllData();

    // 4) Hook refresh button
    const refreshBtn = document.getElementById("refreshDataBtn");
    if (refreshBtn) {
      if (refreshBtn) {
        refreshBtn.addEventListener("click", async () => {
          if (refreshBtn.disabled) return;
          setRefreshButtonState(true);

          try {
            const result = await fetchLatestSensorData();
            latestData = result || {};
            cacheLatestData(result);
            updateTable();
          } catch (error) {
            console.error("Refresh failed:", error);
            alert("Failed to refresh data. Please try again later.");
          } finally {
            setRefreshButtonState(false);
          }
        });
      }
    }
  });

  // 🔽 move these outside so other functions can use them too
  function setRefreshButtonState(isLoading) {
    const refreshBtn = document.getElementById("refreshDataBtn");
    if (!refreshBtn) return;
    refreshBtn.textContent = isLoading ? "Refreshing..." : "🔄 Refresh Data";
    refreshBtn.disabled = isLoading;
  }

  function fetchLatestSensorData() {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .getLatestSensorData();
    });
  }

  function cacheLatestData(data) {
    sessionStorage.setItem("latestSensorData", JSON.stringify(data || {}));
  }

  async function populateLocationDropdown_latest() {
    const selector = document.getElementById("locationSelector");
    if (!selector) return;
    const cached = sessionStorage.getItem("locationList");
    if (cached) {
      try {
        const parsed = JSON.parse(cached);
        if (Array.isArray(parsed) && parsed.length > 0) {
          fillSelectWithLocations(selector, parsed);
          return;
        }
      } catch (error) {
        console.warn("Invalid cached location list, refetching...");
        sessionStorage.removeItem("locationList");
      }
    }



    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(locations => {
          if (!Array.isArray(locations)) locations = [];
          sessionStorage.setItem("locationList", JSON.stringify(locations));
          fillSelectWithLocations(selector, locations);
          resolve();
        })
        .withFailureHandler(error => {
          console.error("getLocations failed:", error);
          reject(error);
        })
        .getLocations();
    });
  }

  function fillSelectWithLocations(selectElement, locations) {
    // keep placeholder option (empty value)
    selectElement.querySelectorAll("option:not([value=''])").forEach(o => o.remove());

    if (!Array.isArray(locations) || locations.length === 0) {
      console.warn("⚠️ No sensor locations available.");
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "No locations available";
      selectElement.appendChild(opt);
      return;
    }

    locations.forEach((location, index) => {
      const opt = document.createElement("option");
      opt.value = index;
      opt.textContent = location;
      selectElement.appendChild(opt);
    });
  }

  async function loadLatestThenAllData() {
    try {
      const cached = sessionStorage.getItem("latestSensorData");
      if (cached) {
        latestData = JSON.parse(cached);
        updateTable();
      }

      const latest = await fetchLatestSensorData();
      latestData = latest || {};
      cacheLatestData(latest);
      updateTable();

      requestIdleCallback(() => {
        google.script.run
          .withSuccessHandler(result => {
            allData = result || {};
            sessionStorage.setItem("allSensorData", JSON.stringify(allData));
          })
          .withFailureHandler(error => {
            console.groupCollapsed("⚠️ [Latest Readings Preload]");
            console.error("getAllSensorData failed:", error);
            console.groupEnd();
          })
          .getAllSensorData();
      });
    } catch (error) {
      console.error("❌ Failed to load latest readings:", error);
      alert("⚠️ Could not load latest readings. Please refresh the page.");
    }
  }

  function updateTable() {
    const selector = document.getElementById("locationSelector");
    if (!selector) return;

    const index = selector.value;
    const locationName = selector.options[selector.selectedIndex].text;
    sessionStorage.setItem("selectedSensor", locationName);

    const lastReading = latestData[index];
    if (!lastReading || !Array.isArray(lastReading)) {
      console.warn(`No valid reading found for location: ${locationName}`);
      insertValues(["N/A", "N/A", "N/A", "N/A", ""]);
      return;
    }
    function insertValues(reading) {
      const [date, time, temp, hum, press] = reading;
      cells.date.textContent = date || "N/A";
      cells.time.textContent = time || "N/A";
      cells.temperature.textContent = temp || "N/A";
      cells.humidity.textContent = hum || "N/A";

      const pressureHeader = document.getElementById("pressureHeader");
      const pressureCell = cells.pressure;

      if (press && press !== "N/A") {
        pressureHeader?.classList.remove("hidden");
        pressureCell.classList.remove("hidden");
        pressureCell.textContent = press;
      } else {
        pressureHeader?.classList.add("hidden");
        pressureCell.classList.add("hidden");
        pressureCell.textContent = "";
      }
    }
</script>
